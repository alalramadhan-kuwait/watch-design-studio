name: Deploy

# The site is plain files, so there is nothing to build — this uploads the
# repository as-is. Deploying from CI rather than from someone's laptop means
# a stale local copy can never overwrite what is live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Turns Pages on for the repository on the first run, so the site
        # needs no setting changed by hand before it can deploy.
        with:
          enablement: true
      # The service worker is replaced only when its bytes change, which is
      # the browser's one signal that a new version exists. Stamping the
      # commit into it means every deploy is one, without anyone having to
      # remember to bump a number.
      - name: Stamp the build into the service worker
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" sw.js
          if grep -q "__BUILD__" sw.js; then
            echo "the build placeholder is still there — the worker would never change"
            exit 1
          fi
          echo "stamped ${GITHUB_SHA::12}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
