name: Test studio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  atelier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- vendor/relief3d.bundle.js
      - run: npm test
